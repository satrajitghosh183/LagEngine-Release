name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: ubuntu-latest
            build_type: Debug
          - os: windows-latest
            build_type: Release
          - os: macos-latest
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          sudo apt-get install -y libopenal-dev libasound2-dev libpulse-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake

      - name: Configure (Ubuntu/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_EDITOR=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DBUILD_EDITOR=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Build (Ubuntu/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release -j

      - name: Test (Ubuntu/macOS)
        if: matrix.os != 'windows-latest' && matrix.build_type == 'Release'
        run: ctest --test-dir build --output-on-failure -j2
        continue-on-error: true

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build -C Release --output-on-failure -j2
        continue-on-error: true

name: Format Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          SRC=$(find Engine Editor Examples -type f \( -name "*.cpp" -o -name "*.hpp" \) ! -path "*/External/*" 2>/dev/null | head -500)
          if [ -z "$SRC" ]; then
            echo "No source files found"
            exit 1
          fi
          TMP=$(mktemp)
          for f in $SRC; do
            clang-format "$f" > "$TMP" && diff -q "$f" "$TMP" > /dev/null || { echo "Formatting check failed: $f"; exit 1; }
          done
          echo "Format check passed"
